      <text class="mono-bold" x="15" y="65">01 // Orchestration</text>
      <text class="mono-text" x="15" y="80">Multi-LLM ReAct loops.</text>
      
      <text class="mono-bold" x="15" y="110">02 // Unified Memory</text>
