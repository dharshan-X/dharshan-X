      <text class="mono-bold" x="130" y="84">LinkedIn</text>
      <text class="mono-text" x="230" y="84">linkedin.com/in/dharshan-balaji-a72a67308</text>
    </g>
  </g>

  <!-- Footer Stats / Marks -->
  <g transform="translate(60, 1128)">
    <text class="mono-meta" x="0" y="0">SPEC-ID: <tspan fill="var(--text-primary)">DHARSHAN-README-v2</tspan></text>
    <text class="mono-meta" x="220" y="0">ENCODING: <tspan fill="var(--text-primary)">UTF-8 / SVG</tspan></text>
