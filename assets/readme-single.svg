    <path class="schematic active" d="M 230,120 L 250,120 L 250,120 L 270,120" />
    <polygon points="270,117 276,120 270,123" fill="var(--accent)" />

    <!-- Column 2: Systems & Security -->
    <g transform="translate(250, 30)">
      <rect class="card-bg" x="0" y="0" width="230" height="180" rx="4" />
      <path d="M 0,0 L 230,0" stroke="var(--accent)" stroke-width="2" />

      <text class="mono-bold" x="15" y="30">Systems &amp; Linux NetSec</text>

      <text class="mono-bold" x="15" y="65">01 // Custom Languages</text>
      <text class="mono-text" x="15" y="80">Rust lexer &amp; AST eval.</text>

      <text class="mono-bold" x="15" y="110">02 // Threat Detection</text>
      <text class="mono-text" x="15" y="125">Scapy + ML anomalies.</text>

      <text class="mono-bold" x="15" y="155">03 // Clean-Room Git</text>
      <text class="mono-text" x="15" y="170">SHA-1 store &amp; 3-way merge.</text>
    </g>

    <!-- Flow indicator schematic lines -->
    <path class="schematic" d="M 480,120 L 500,120 M 480,120 L 500,120" />
    <polygon points="500,117 506,120 500,123" fill="var(--text-muted)" />

    <!-- Column 3: Mobile & UI -->
    <g transform="translate(500, 30)">
      <rect class="card-bg" x="0" y="0" width="230" height="180" rx="4" />
      <path d="M 0,0 L 230,0" stroke="var(--text-muted)" stroke-width="2" />

      <text class="mono-bold" x="15" y="30">Mobile &amp; Cross-Platform</text>

      <text class="mono-bold" x="15" y="65">01 // Android Audio</text>
      <text class="mono-text" x="15" y="80">Compose + Media3 Hi-Res.</text>

      <text class="mono-bold" x="15" y="110">02 // Component Kits</text>
      <text class="mono-text" x="15" y="125">49 RN UI components.</text>

      <text class="mono-bold" x="15" y="155">03 // Motion Web</text>
      <text class="mono-text" x="15" y="170">GSAP &amp; Motion sites.</text>
    </g>
  </g>

  <!-- ================= SECTION 03: ACTIVE PROJECTS ================= -->
  <g transform="translate(60, 760)">
    <rect class="grid-line" x="0" y="-12" width="10" height="10" fill="var(--accent)" />
    <text class="section-title" x="20" y="0">// 03. FEATURED REPOSITORIES</text>

    <!-- Registry Table Grid -->
    <g transform="translate(0, 20)">
      <rect class="card-bg" x="0" y="0" width="730" height="180" rx="4" />
      
      <!-- Table Header -->
      <line class="grid-line" x1="0" y1="35" x2="730" y2="35" stroke-width="1.5" />
      <text class="mono-bold" x="20" y="22">Repository</text>
      <text class="mono-bold" x="165" y="22">Architecture Summary</text>
      <text class="mono-bold" x="550" y="22">Stack</text>
      <text class="mono-bold" x="655" y="22">Signal</text>
      
      <!-- Row 1: ProjectYolo -->
      <text class="mono-bold" x="20" y="62" fill="var(--accent)">ProjectYolo</text>
      <text class="mono-text" x="165" y="62">Autonomous AI agent with GUI vision &amp; mem0</text>
      <text class="mono-text" x="550" y="62">Python</text>
      <text class="mono-bold" x="655" y="62">3 stars</text>
      <line class="grid-line" x1="0" y1="75" x2="730" y2="75" />

      <!-- Row 2: Tonarc -->
      <text class="mono-bold" x="20" y="97" fill="var(--accent)">Tonarc</text>
      <text class="mono-text" x="165" y="97">Privacy-first Android Hi-Res audio client</text>
      <text class="mono-text" x="550" y="97">Kotlin</text>
      <text class="mono-bold" x="655" y="97">4 stars</text>
      <line class="grid-line" x1="0" y1="110" x2="730" y2="110" />

      <!-- Row 3: ActiveRag_Model -->
      <text class="mono-bold" x="20" y="132" fill="var(--accent)">ActiveRag_Model</text>
      <text class="mono-text" x="165" y="132">ReAct GraphRAG agent on Neo4j + FastAPI</text>
      <text class="mono-text" x="550" y="132">Python</text>
      <text class="mono-bold" x="655" y="132">API v2</text>
      <line class="grid-line" x1="0" y1="145" x2="730" y2="145" />

      <!-- Row 4: Netguard-pro -->
      <text class="mono-bold" x="20" y="167" fill="var(--accent)">Netguard-pro</text>
      <text class="mono-text" x="165" y="167">Scapy live sniffer, ML &amp; iptables defense</text>
      <text class="mono-text" x="550" y="167">Python/React</text>
      <text class="mono-bold" x="655" y="167">Active</text>
    </g>
  </g>

  <!-- ================= SECTION 04: NETWORK PORTS ================= -->
  <g transform="translate(60, 985)">
    <rect class="grid-line" x="0" y="-12" width="10" height="10" fill="var(--accent)" />
    <text class="section-title" x="20" y="0">// 04. NETWORK SOCKETS &amp; PORTS</text>

    <g transform="translate(0, 20)">
